[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "asap"
version = "0.1.0"
description = "ASAP - Autonomous SRE Agentic Platform (proof of concept)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Fallback Rego evaluator when the `opa` binary is not installed (wheels are not published for every platform).
rego = ["regopy>=0.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
asap = "asap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["asap"]

[tool.hatch.build.targets.wheel.force-include]
"policies" = "asap/_policies"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP035", "B904", "E501", "UP031"]
